<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121b30"><title>JAPAN QUEST | 47都道府県制覇</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#f3f5fa;background:#111a2e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#273755,#111a2e 62%);min-height:100vh}.wrap{max-width:950px;margin:auto;padding:22px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{letter-spacing:.22em;color:#e8c477;font-size:11px;font-weight:800}h1{font-size:clamp(23px,5vw,35px);margin:5px 0 0}.stat{margin:22px 0 12px;padding:18px 20px;background:#1c2941;border:1px solid #344560;border-radius:16px}.statrow{display:flex;align-items:end;justify-content:space-between;gap:8px}.stat strong{font-size:30px;color:#efcd80}.stat small{color:#b4c0d3}.track{margin-top:12px;height:11px;background:#3b4961;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#b78c3d,#f1d58c);transition:width .2s}.mapcard{border:1px solid #344560;border-radius:18px;background:#19253c;padding:16px;min-height:420px}.maphead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.maphead span{color:#9eacc3;font-size:12px}.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:10px;align-items:stretch}.mainmap{height:480px;min-width:0}.side{display:flex;flex-direction:column;gap:12px}.inset{background:#202f48;border:1px solid #3c4b62;border-radius:12px;flex:1;min-height:180px;padding:10px}.inset label{display:block;color:#c9d2e0;font-size:12px;font-weight:700}.inset svg{width:100%;height:calc(100% - 20px)}svg{width:100%;height:100%;overflow:visible}.pref{fill:#65738a;stroke:#1c2940;stroke-width:.75;vector-effect:non-scaling-stroke;transition:fill .15s}.pref.visited{fill:#eac77c}.mapmsg{text-align:center;color:#cbd5e1;padding:12px}.btn{border:0;background:#e9c779;color:#172137;border-radius:12px;padding:15px 20px;font-weight:800;font-size:15px;cursor:pointer}.btn:active{transform:translateY(1px)}.action{display:block;width:100%;margin-top:17px}.hint{font-size:12px;color:#a8b4c9;text-align:center;margin-top:13px;line-height:1.7}.overlay{position:fixed;inset:0;background:#050b17c9;display:none;align-items:center;justify-content:center;padding:12px;z-index:3}.overlay.show{display:flex}.dialog{background:#19263d;border:1px solid #465572;border-radius:18px;width:min(100%,580px);max-height:min(90vh,850px);display:flex;flex-direction:column;overflow:hidden}.dialogheader{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #35435b}.dialogheader h2{margin:0;font-size:19px}.close{border:0;background:#34445d;color:white;border-radius:8px;padding:8px 12px;font-size:18px;cursor:pointer}.list{overflow:auto;padding:10px 18px 22px}.group h3{color:#edc979;font-size:14px;margin:22px 0 8px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{display:flex;align-items:center;gap:9px;padding:11px;background:#26354e;border:1px solid #394962;border-radius:9px;cursor:pointer}.item input{accent-color:#eac77c;width:18px;height:18px}.item:has(input:checked){background:#51452e;border-color:#ab8b4e}.source{font-size:10px;color:#8592a8;text-align:center;margin-top:18px}.source a{color:#9fb1d2}@media(max-width:600px){.wrap{padding:18px 12px 40px}.mapcard{padding:10px;min-height:0}.mapgrid{grid-template-columns:minmax(0,1fr) 92px;gap:5px}.mainmap{height:390px}.inset{padding:6px;min-height:155px}.inset label{font-size:10px}.maphead span{font-size:10px}.checks{gap:7px}.item{padding:10px 8px;font-size:13px}}@media(max-width:390px){.mainmap{height:335px}.mapgrid{grid-template-columns:minmax(0,1fr) 77px}.inset{min-height:130px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">TRAVEL COLLECTION</div><h1>JAPAN QUEST</h1></div><div style="font-size:31px">◈</div></header><section class="stat"><div class="statrow"><div><small>全国制覇の進捗</small><div><strong id="count">0</strong><span style="color:#b9c4d5"> / 47 都道府県</span></div></div><small id="percent">0.0%</small></div><div class="track"><div class="fill" id="bar"></div></div></section><section class="mapcard"><div class="maphead"><b>JAPAN MAP</b><span>金色：訪問済み ／ グレー：未訪問</span></div><div class="mapgrid"><div class="mainmap" id="mainmap"><div class="mapmsg" id="status">日本地図を読み込み中…</div></div><div class="side"><div class="inset"><label>北海道</label><div id="hokkaido" style="height:calc(100% - 20px)"></div></div><div class="inset"><label>沖縄県</label><div id="okinawa" style="height:calc(100% - 20px)"></div></div></div></div></section><button class="btn action" id="open">＋ 訪問した都道府県を登録</button><p class="hint">訪問済みにチェックを入れると、日本地図が金色に変わります。<br>記録はこのブラウザ内に自動保存されます。</p><p class="source">地図データ：<a href="https://github.com/dataofjapan/land" target="_blank" rel="noopener">地球地図日本 / dataofjapan</a>（非営利利用・出典明記）</p></main><div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div class="dialogheader"><h2 id="dialogtitle">訪問した都道府県</h2><button class="close" id="close" aria-label="閉じる">×</button></div><div class="list" id="list"></div></div></div><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><script>
const regions={"北海道":["北海道"],"東北":["青森県","岩手県","宮城県","秋田県","山形県","福島県"],"関東":["茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県"],"中部":["新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県"],"近畿":["三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県"],"中国":["鳥取県","島根県","岡山県","広島県","山口県"],"四国":["徳島県","香川県","愛媛県","高知県"],"九州・沖縄":["福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"]};
const all=Object.values(regions).flat();const key='japan-quest-visited-v1';let visited=[];try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))visited=a.filter(x=>all.includes(x))}catch(e){}let features=[];
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(visited))}catch(e){alert('このブラウザでは保存できません。通常モードで開いてください。')}}function update(){const n=visited.length;$('count').textContent=n;$('percent').textContent=(n/47*100).toFixed(1)+'%';$('bar').style.width=n/47*100+'%';document.querySelectorAll('[data-pref]').forEach(el=>el.classList.toggle('visited',visited.includes(el.dataset.pref)))}
function list(){const root=$('list');root.innerHTML='';for(const [region,names] of Object.entries(regions)){const group=document.createElement('section');group.className='group';const h=document.createElement('h3');h.textContent=region;group.append(h);const checks=document.createElement('div');checks.className='checks';for(const name of names){const label=document.createElement('label');label.className='item';const input=document.createElement('input');input.type='checkbox';input.checked=visited.includes(name);input.addEventListener('change',()=>{if(input.checked&&!visited.includes(name))visited.push(name);if(!input.checked)visited=visited.filter(v=>v!==name);save();update()});label.append(input,document.createTextNode(name));checks.append(label)}group.append(checks);root.append(group)}}
$('open').onclick=()=>{$('overlay').classList.add('show');list()};$('close').onclick=()=>{$('overlay').classList.remove('show')};$('overlay').onclick=e=>{if(e.target===$('overlay'))$('close').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('close').click()});update();
function pointsOf(g){let out=[];function walk(c){if(typeof c[0]==='number'){out.push(c);return}for(const a of c)walk(a)}walk(g.coordinates);return out}
function project(lon,lat){return [(lon-128)*36,(46-lat)*43]}
function ringPath(ring){return ring.map((p,i)=>{const [x,y]=project(p[0],p[1]);return (i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)}).join('')+'Z'}
function pathGeometry(g){const poly=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];return poly.map(rings=>rings.map(ringPath).join('')).join('')}
function renderMap(id,items){const host=$(id);host.innerHTML='';const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('role','img');svg.setAttribute('aria-label',id==='mainmap'?'本州・四国・九州の都道府県地図':id==='hokkaido'?'北海道の地図':'沖縄県の地図');let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;for(const f of items){for(const p of pointsOf(f.geometry)){const [x,y]=project(...p);minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y)}}if(!isFinite(minx))return;const w=maxx-minx,h=maxy-miny,pad=Math.max(w,h)*.04;svg.setAttribute('viewBox',`${minx-pad} ${miny-pad} ${w+2*pad} ${h+2*pad}`);svg.setAttribute('preserveAspectRatio','xMidYMid meet');for(const f of items){const name=f.properties.nam_ja||f.properties.name||'';const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',pathGeometry(f.geometry));path.setAttribute('fill-rule','evenodd');path.setAttribute('class','pref');path.dataset.pref=name;const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=name;path.append(title);svg.append(path)}host.append(svg)}
async function loadMap(){try{if(!window.topojson)throw Error('地図描画ライブラリを取得できません');const res=await fetch('https://raw.githubusercontent.com/dataofjapan/land/master/japan.topojson');if(!res.ok)throw Error('地図データ取得エラー');const topo=await res.json();const obj=Object.values(topo.objects)[0];features=topojson.feature(topo,obj).features;const main=features.filter(f=>!['北海道','沖縄県'].includes(f.properties.nam_ja));renderMap('mainmap',main);renderMap('hokkaido',features.filter(f=>f.properties.nam_ja==='北海道'));renderMap('okinawa',features.filter(f=>f.properties.nam_ja==='沖縄県'));if(!document.querySelector('.pref'))throw Error('都道府県データを読み取れません');update()}catch(err){$('mainmap').innerHTML='<div class="mapmsg">地図を読み込めませんでした。<br>インターネット接続を確認して再読み込みしてください。<br><small>'+String(err.message).replace(/[<>&]/g,'')+'</small></div>'}}
loadMap();
</script></body></html>
