<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>普段の募金</title>
<style>
:root{font-family:system-ui,-apple-system,'Yu Gothic',sans-serif;color:#20342c;background:#f6f8f5}*{box-sizing:border-box}body{margin:0;padding:24px 14px}.app{max-width:540px;margin:auto}h1{font-size:26px;margin:8px 0 20px}.summary,.panel{background:white;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 2px 12px #15341c0a}.summary{text-align:center}.muted{color:#64756a;font-size:14px}.total{font-size:42px;font-weight:800;margin:8px 0;color:#24704b}label{display:block;margin:16px 0 6px;font-weight:700}input,textarea{width:100%;border:1px solid #cbd7ce;border-radius:10px;padding:13px;font:inherit;background:#fff}textarea{resize:vertical;min-height:75px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#24704b;color:white;font:inherit;font-weight:700;margin-top:18px;cursor:pointer}.record{border-top:1px solid #e5ece6;padding:13px 0;display:flex;gap:10px;justify-content:space-between;align-items:start}.record:first-child{border-top:0}.record strong{font-size:18px}.record small{color:#64756a}.delete{background:none;color:#a34343;border:1px solid #e4b7b7;width:auto;margin:0;padding:6px 10px;font-size:12px}.empty{text-align:center;color:#64756a;padding:16px 0}.foot{font-size:12px;color:#64756a;line-height:1.6}
</style>
</head>
<body><main class="app"><h1>🌱 募金のきろく</h1><section class="summary"><div class="muted">これまでの募金総額</div><div class="total" id="total">¥0</div><div class="muted" id="count">0件の募金</div></section><section class="panel"><h2>募金を記録</h2><form id="form"><label for="amount">募金額（円）</label><input id="amount" type="number" inputmode="numeric" min="1" step="1" placeholder="例：100" required><label for="purpose">募金先・内容</label><input id="purpose" type="text" maxlength="120" placeholder="例：盲導犬育成募金" required><label for="place">場所（任意）</label><input id="place" type="text" maxlength="120" placeholder="例：駅前のスーパー"><button type="submit">記録する</button></form></section><section class="panel"><h2>これまでの記録</h2><div id="history"></div></section><p class="foot">記録はこのブラウザ内に保存されます。別の端末には自動で同期されません。ブラウザのデータを消すと記録も消えるため、大切な記録は別途控えてください。</p></main><script>
const KEY='donation-records-v1';let records=[];try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))records=data;}catch(e){alert('保存データを読み込めませんでした。');}
const yen=n=>'¥'+n.toLocaleString('ja-JP');function render(){document.getElementById('total').textContent=yen(records.reduce((sum,r)=>sum+r.amount,0));document.getElementById('count').textContent=records.length+'件の募金';const root=document.getElementById('history');root.replaceChildren();if(!records.length){const p=document.createElement('p');p.className='empty';p.textContent='まだ記録はありません';root.append(p);return;}for(const r of records){const row=document.createElement('div');row.className='record';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=r.purpose;const details=document.createElement('div');const small=document.createElement('small');small.textContent=r.date+(r.place?' ・ '+r.place:'');details.append(small);const amount=document.createElement('div');amount.textContent=yen(r.amount);info.append(title,details,amount);const del=document.createElement('button');del.className='delete';del.textContent='削除';del.addEventListener('click',()=>{if(confirm('この記録を削除しますか？')){records=records.filter(x=>x.id!==r.id);save();}});row.append(info,del);root.append(row);}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records));render();}catch(e){alert('保存できませんでした。ブラウザの設定や空き容量を確認してください。');}}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const amount=Number(document.getElementById('amount').value);const purpose=document.getElementById('purpose').value.trim();const place=document.getElementById('place').value.trim();if(!Number.isSafeInteger(amount)||amount<=0||!purpose){alert('募金額と内容を正しく入力してください。');return;}records.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2),amount,purpose,place,date:new Date().toLocaleDateString('ja-JP')});save();e.target.reset();});render();
</script></body></html>
